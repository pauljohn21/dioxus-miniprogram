[workspace]
resolver = "2"
members = [
    "packages/dioxus-miniprogram",
    "packages/dioxus-miniprogram-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Dioxus Labs"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/pauljohn21/dioxus-miniprogram"
homepage = "https://dioxuslabs.com"

[workspace.dependencies]
# Core dependencies
dioxus-core = { git = "https://github.com/DioxusLabs/dioxus", tag = "0.7.0" }
dioxus-core-types = { git = "https://github.com/DioxusLabs/dioxus", tag = "0.7.0" }
dioxus-html = { git = "https://github.com/DioxusLabs/dioxus", tag = "0.7.0" }
dioxus-signals = { git = "https://github.com/DioxusLabs/dioxus", tag = "0.7.0" }
dioxus-cli-config = { git = "https://github.com/DioxusLabs/dioxus", tag = "0.7.0" }
dioxus-devtools = { git = "https://github.com/DioxusLabs/dioxus", tag = "0.7.0" }

# Rust standard library dependencies
rustc-hash = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures-util = "0.3"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Worker", "MessageEvent", "Blob", "Url"] }

[profile.release]
opt-level = "s"
lto = true
